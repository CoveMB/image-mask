[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmask"
version = "0.1.0"
description = "Local single-photo trusted RGB16 project"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "Pillow==13.0.0", "tifffile==2026.10.15", "rawpy==0.27.1", "tomli-w==1.2.0", "scipy==1.17.1", "torch==2.13.0", "torchvision==0.28.0", "transformers==4.57.6", "safetensors==0.8.0"]

[project.scripts]
blackmask = "blackmask.cli:main"

[tool.setuptools.package-data]
blackmask = ["ui/*.html", "ui/*.js"]

[tool.setuptools.data-files]
"share/blackmask/config" = ["config/storage.example.toml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: real explicitly installed model inference",
    "browser: real installed Chrome with isolated Playwright setup",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
